<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="tM34IT0dJ94dfZRdEdjNKt">
<head data-page-node-id="cpq8Q4JGmXzyGr2YPuFio9">
<meta charset="utf-8" data-page-node-id="Y5Bj2kEhR6vMsI2fJDCFwv">
<meta name="viewport" content="width=device-width,initial-scale=1" data-page-node-id="UcXCDC6uuYfA5XLAtJIR7t">
<title>影匣 · 本地影片库</title>
<style>
:root{
  --bg:#0b0d10; --panel:#14171c; --panel2:#101317;
  --line:rgba(255,255,255,.09); --txt:#e9ebee; --dim:#8b9298; --dim2:#666d73;
  --gold:#e3b171; --gold2:#f2cf9b; --danger:#e26d5c;
  --radius:12px; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 560px at 10% -8%, rgba(227,177,113,.09), transparent 60%),
    radial-gradient(900px 480px at 94% 0%, rgba(70,105,150,.08), transparent 60%),
    var(--bg);
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei UI","PingFang SC",sans-serif;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
.wrap{max-width:1440px;margin:0 auto;padding:26px 30px 60px;display:flex;gap:36px;align-items:flex-start}
.main{flex:1;min-width:0}
h1,h2,h3{font-family:"Songti SC","Source Han Serif SC","SimSun",serif;font-weight:600}

/* ── header ── */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
  padding-bottom:18px;border-bottom:1px solid var(--line)}
.brand h1{font-size:40px;line-height:1;margin:0;letter-spacing:.16em;
  background:linear-gradient(180deg,#fff 20%,#a8a49c 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.brand h1 .bt{font-size:20px;letter-spacing:.1em;margin-left:.4em;font-weight:500}
.brand .sub{margin-top:10px;color:var(--dim);font-size:13px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.brand .sub b{color:var(--gold2);font-weight:600;font-variant-numeric:tabular-nums}
.dot{width:4px;height:4px;border-radius:50%;background:#3a3f45}
.tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.search{position:relative}
.search input{width:220px;height:40px;border-radius:10px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);color:var(--txt);padding:0 14px 0 34px;font-size:16px;outline:none;transition:.2s}
.search input:focus{border-color:rgba(227,177,113,.5);width:260px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;opacity:.5}
.btn{height:40px;padding:0 15px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.045);
  color:var(--txt);font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.18s;
  white-space:nowrap;font-family:inherit;letter-spacing:.02em}
.btn:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.2);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(180deg,#f0c98f,#d9a865);border-color:#e0b57c;color:#1a1109;font-weight:600}
.btn.primary:hover{background:linear-gradient(180deg,#f7d7a6,#e5b772)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:rgba(226,109,92,.4)}
.btn.danger:hover{background:rgba(226,109,92,.12)}
.btn svg{width:15px;height:15px;opacity:.85}

/* ── 左侧栏导航 ── */
.side{flex:0 0 216px;position:sticky;top:24px;display:flex;flex-direction:column;
  min-height:calc(100vh - 90px)}
.side .brand h1{font-size:30px}
.snav{display:flex;flex-direction:column;gap:6px;margin-top:26px}
.snav .tab{width:100%;height:40px;border-radius:10px;display:flex;align-items:center;
  justify-content:space-between;padding:0 14px}
.snav .tab .n{margin-left:0}
.sidefoot{margin-top:auto;padding-top:18px;display:flex;flex-direction:column;gap:14px}
.sidefoot .btn{width:100%;justify-content:center}
.sstats{display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:var(--dim);
  border-top:1px solid var(--line);padding-top:16px}
.sstats .row{display:flex;justify-content:space-between;gap:12px}
.sstats b{color:var(--gold2);font-weight:600;font-variant-numeric:tabular-nums}
.tab{height:36px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:transparent;
  color:var(--dim);font-size:13px;cursor:pointer;font-family:inherit;letter-spacing:.05em;transition:.16s}
.tab:hover{color:#fff;border-color:rgba(255,255,255,.22)}
.tab.is-on{color:#1a1109;background:linear-gradient(180deg,#f0c98f,#d9a865);border-color:#e0b57c;font-weight:600}
.tab .n{font-size:11px;opacity:.75;font-variant-numeric:tabular-nums;margin-left:4px}

/* ── 筛选分组 ── */
.fsection{margin-top:18px}
.glab{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--dim2);
  letter-spacing:.22em;margin-bottom:9px}
.glab::after{content:"";flex:1;height:1px;background:var(--line)}
.sdot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;margin:0 1px 0 3px}

/* ── 侧栏观看热力图 ── */
.hmap{margin-top:24px}
.hgrid{position:relative;padding-top:15px;display:flex;gap:3px}
.hdays{display:flex;flex-direction:column;justify-content:space-between;width:13px;flex:0 0 13px;height:75px}
.hdays span{height:9px;line-height:9px;font-size:9px;color:var(--dim2)}
.hcols{display:flex;gap:2px}
.hcol{display:flex;flex-direction:column;gap:2px}
.hcell{width:9px;height:9px;border-radius:2.5px;background:rgba(255,255,255,.055)}
.hcell.l1{background:#1e4423}
.hcell.l2{background:#2d6b31}
.hcell.l3{background:#3f9440}
.hcell.l4{background:#5cc95b}
.hcell.future{background:transparent}
.hcell.today{box-shadow:0 0 0 1px rgba(227,177,113,.75)}
.hmonths{position:absolute;top:0;left:16px;right:0;height:13px}
.hmonths span{position:absolute;top:0;font-size:10px;color:var(--dim2);white-space:nowrap;letter-spacing:.05em}
.hsum{margin-top:9px;font-size:11px;color:var(--dim2);line-height:1.5}
.hsum b{color:var(--gold2);font-weight:600}

/* ── filter bar ── */
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0 4px}
.chip{height:30px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:transparent;
  color:var(--dim);font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.16s;font-family:inherit}
.chip:hover{color:#fff;border-color:rgba(255,255,255,.22)}
.chip.is-on{color:#1a1109;background:linear-gradient(180deg,#f0c98f,#d9a865);border-color:#e0b57c;font-weight:600}
.chip .n{font-size:11px;opacity:.72;font-variant-numeric:tabular-nums}
.spacer{flex:1}
.sortsel{height:30px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);
  color:var(--dim);font-size:12.5px;padding:0 10px;outline:none;cursor:pointer;font-family:inherit}

/* ── grid & cards ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px 15px;margin-top:18px}
.cell{position:relative;border:0;background:none;cursor:pointer;padding:0;text-align:left;font-family:inherit;color:inherit;width:100%}
.frame{position:relative;aspect-ratio:2/3;border-radius:var(--radius);overflow:hidden;background:#15181d;
  border:1px solid rgba(255,255,255,.06);box-shadow:0 10px 26px -16px #000;
  transition:transform .25s,box-shadow .25s,border-color .25s}
.frame img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s}
.cell:hover .frame{transform:translateY(-4px);border-color:rgba(227,177,113,.38);box-shadow:0 20px 40px -16px #000}
.cell:hover .frame img{transform:scale(1.05)}
.noposter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
  background:repeating-linear-gradient(135deg,#15181c,#15181c 12px,#1b1f24 12px,#1b1f24 24px);color:var(--dim2)}
.noposter svg{width:30px;height:30px;opacity:.45}
.noposter .ph-t{font-size:12px;letter-spacing:.14em;color:#c3cbd2}
.cap{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.82))}
.cap h3{margin:0;font-size:13.5px;letter-spacing:.02em;line-height:1.35;color:#fff;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.cap p{margin:4px 0 0;font-size:11px;color:#a8adb3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seen{position:absolute;top:9px;right:9px;font-size:10.5px;padding:3px 7px;border-radius:5px;
  background:rgba(227,177,113,.16);border:1px solid rgba(227,177,113,.5);color:var(--gold2)}
.seen.st-want{background:rgba(167,139,250,.14);border-color:rgba(167,139,250,.5);color:#c4b5fd}
.seen.st-ing{background:rgba(96,165,250,.14);border-color:rgba(96,165,250,.5);color:#93c5fd}
.starr{display:inline-flex;gap:2px;align-items:center;vertical-align:middle}
.starr svg{width:15px;height:15px}
.starr .on{fill:var(--gold2)}
.starr .off{fill:#3a3f45}
.reviewbox{border:1px solid var(--line);border-radius:10px;background:#15181d;
  padding:10px 12px;font-size:12.5px;color:#c9ced3;line-height:1.7;white-space:pre-wrap}
/* actor card */
.acard{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 10px 14px;
  border:1px solid var(--line);border-radius:var(--radius);background:var(--panel2);transition:.2s}
.acard:hover{border-color:rgba(227,177,113,.38);transform:translateY(-3px)}
.avatar{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:600;color:#1a1109;background:linear-gradient(180deg,#f0c98f,#d9a865);
  font-family:"Songti SC","SimSun",serif;flex:0 0 auto}
.avatar.f{background:linear-gradient(180deg,#e8b7c6,#d2879f)}
.acard h3{margin:0;font-size:14px;color:#fff;letter-spacing:.04em}
.acard p{margin:0;font-size:11.5px;color:var(--dim)}
.empty{grid-column:1/-1;text-align:center;color:var(--dim2);padding:80px 20px;font-size:14px;letter-spacing:.08em}

/* ── footer ── */
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);display:flex;gap:16px;flex-wrap:wrap;
  font-size:11.5px;color:var(--dim2);letter-spacing:.04em}
.foot b{color:#9aa0a6;font-weight:400}

/* ── modal ── */
.mask{position:fixed;inset:0;background:rgba(3,4,5,.72);backdrop-filter:blur(6px);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:.2s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{width:min(880px,100%);max-height:90vh;overflow:auto;background:linear-gradient(180deg,#13161a,#0d0f12);
  border:1px solid var(--line);border-radius:16px;box-shadow:0 40px 90px -30px #000;position:relative;
  transform:translateY(10px);transition:.22s}
.mask.on .sheet{transform:none}
.sheet.slim{width:min(560px,100%)}
.sheet .x{position:absolute;right:12px;top:11px;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);
  background:rgba(255,255,255,.05);color:#cfd4d8;cursor:pointer;font-size:15px;line-height:1;z-index:2}
.sheet .x:hover{background:rgba(255,255,255,.12)}
.detail{display:grid;grid-template-columns:1.05fr 1fr}
.detail .visual{position:relative;background:#000;min-height:320px;display:flex;align-items:center;justify-content:center}
.detail .visual img{width:100%;height:100%;object-fit:cover}
.detail .info{padding:24px 24px 20px}
.detail h2{font-size:24px;margin:0 0 6px;letter-spacing:.03em}
.detail .meta{color:var(--dim);font-size:12.5px;margin-bottom:14px;letter-spacing:.04em}
.detail .note{color:#b9bfc4;font-size:13px;line-height:1.85;margin:0 0 16px;white-space:pre-wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:12px;margin-bottom:16px}
.kv .k{color:var(--dim2);white-space:nowrap}
.kv .v{color:#dcdfe2;word-break:break-all;font-variant-numeric:tabular-nums}
.copy{background:none;border:1px solid var(--line);color:var(--dim);border-radius:6px;font-size:11px;
  padding:2px 8px;cursor:pointer;margin-left:8px;font-family:inherit}
.copy:hover{color:#fff;border-color:rgba(255,255,255,.3)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{height:36px;font-size:12.5px}
.secttl{font-size:11.5px;color:var(--dim2);letter-spacing:.14em;margin:14px 0 8px}
.starchips{display:flex;gap:7px;flex-wrap:wrap}
.starchip{font-size:12.5px;padding:5px 12px;border-radius:999px;border:1px solid rgba(227,177,113,.35);
  color:var(--gold2);cursor:pointer;background:rgba(227,177,113,.08);font-family:inherit}
.starchip:hover{background:rgba(227,177,113,.2)}
.minifilms{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px 10px;margin-top:6px}
.minifilm{cursor:pointer;text-align:left;padding:0;border:0;background:none;font-family:inherit;color:inherit}
.minifilm .mf{aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:#15181d;border:1px solid var(--line);position:relative}
.minifilm img{width:100%;height:100%;object-fit:cover}
.minifilm span{display:block;font-size:11.5px;color:#c9ced3;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* form */
.form{padding:26px 26px 22px}
.form h2{font-size:21px;margin:0 0 16px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:11.5px;color:var(--dim2);letter-spacing:.1em;margin-bottom:6px}
.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld textarea,.fld select{
  width:100%;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.045);
  color:var(--txt);padding:9px 12px;font-size:16px;outline:none;font-family:inherit}
.fld textarea{min-height:88px;resize:vertical;line-height:1.7}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:rgba(227,177,113,.5)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.coverbox{display:flex;gap:12px;align-items:center}
.coverbox .cthumb{width:64px;height:92px;border-radius:8px;overflow:hidden;background:#15181d;
  border:1px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--dim2);font-size:11px}
.coverbox .cthumb img{width:100%;height:100%;object-fit:cover}
.coverbtns{display:flex;flex-direction:column;gap:7px}
.coverbtns .btn{height:32px;font-size:12px}
.actorpick{border:1px solid var(--line);border-radius:10px;padding:12px}
.picked{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.picked .pk{font-size:12px;padding:4px 10px;border-radius:999px;background:rgba(227,177,113,.12);
  border:1px solid rgba(227,177,113,.4);color:var(--gold2);display:inline-flex;align-items:center;gap:6px}
.picked .pk i{font-style:normal;cursor:pointer;opacity:.7}
.picked .pk i:hover{opacity:1}
.pickrow{display:flex;gap:8px;flex-wrap:wrap}
.pickrow select,.pickrow input{flex:1 1 130px;min-width:0;border-radius:8px;border:1px solid var(--line);
  background:rgba(255,255,255,.045);color:var(--txt);padding:7px 10px;font-size:16px;outline:none;font-family:inherit}
.pickrow .btn{height:34px;font-size:12px}
.facts{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}
.menu{padding:14px;display:flex;flex-direction:column;gap:8px}
.menu .btn{justify-content:flex-start}
.hintbox{font-size:12.5px;color:#b9bfc4;line-height:2;margin-bottom:16px}
.hintbox b{color:var(--gold2)}
/* ── 演员照片与资料增强 ── */
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.bigavatar{width:150px;height:150px;border-radius:50%;overflow:hidden;flex:0 0 auto;
  border:2px solid rgba(227,177,113,.35);box-shadow:0 10px 26px -14px #000}
.bigavatar img{width:100%;height:100%;object-fit:cover;display:block}
.bigavatar .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:52px;font-weight:600;color:#1a1109;background:linear-gradient(180deg,#f0c98f,#d9a865);
  font-family:"Songti SC","SimSun",serif}
.kvgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 26px;margin-bottom:14px}
.kvgrid .kv{margin-bottom:0}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px;margin-top:6px}
.photo-item{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:1/1;border:1px solid var(--line);background:#15181d}
.photo-item img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.photo-item .pacts{position:absolute;left:0;right:0;bottom:0;display:flex;gap:3px;padding:4px;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.82));opacity:0;transition:.15s}
.photo-item:hover .pacts{opacity:1}
.pbtn{flex:1;height:22px;border-radius:5px;border:1px solid rgba(255,255,255,.18);background:rgba(20,22,26,.85);
  color:#dfe2e5;font-size:10.5px;cursor:pointer;font-family:inherit;padding:0}
.pbtn:hover{border-color:rgba(227,177,113,.6);color:var(--gold2)}
.pbtn.del:hover{color:var(--danger);border-color:rgba(226,109,92,.6)}
.covmark{position:absolute;top:4px;left:4px;font-size:10px;padding:2px 6px;border-radius:4px;
  background:rgba(227,177,113,.85);color:#1a1109;font-weight:600}
.lightbox{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.92);display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:14px}
.lightbox.on{display:flex}
.lightbox img{max-width:86vw;max-height:78vh;border-radius:8px;object-fit:contain}
.lightbox .lb-acts{display:flex;gap:10px;align-items:center}
.lightbox .lb-idx{color:var(--dim);font-size:12.5px;font-variant-numeric:tabular-nums}
.vfile{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;font-size:12.5px;color:#c9ced3;flex-wrap:wrap}
.vfile b{color:var(--txt);font-weight:600;word-break:break-all}
.vfile .btn{height:30px;font-size:11.5px;flex:0 0 auto}
@media (max-width:760px){.kvgrid{grid-template-columns:1fr}}
/* 影片表单：发行日期 / 类型多选 / 已看勾选 */
.daterow{display:flex;gap:8px;flex-wrap:wrap}
.daterow select{flex:1 1 90px;min-width:0;border-radius:8px;border:1px solid var(--line);
  background:#15181d;color:var(--txt);padding:9px 10px;font-size:13px;outline:none}
.daterow select:focus{border-color:var(--gold)}
.daterow select:disabled{opacity:.4;cursor:not-allowed}
.gchips{display:flex;gap:8px;flex-wrap:wrap}
.gchip{font-size:12.5px;padding:6px 14px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--dim);transition:all .15s}
.gchip:hover{border-color:var(--gold);color:var(--gold2)}
.gchip.is-on{background:rgba(227,177,113,.14);border-color:var(--gold);color:var(--gold2)}
.gnewrow{display:flex;gap:8px;margin-top:8px}
.gnewrow input{flex:1 1 140px;min-width:0;border-radius:8px;border:1px solid var(--line);
  background:#15181d;color:var(--txt);padding:8px 10px;font-size:12.5px;outline:none}
.gnewrow input:focus{border-color:var(--gold)}
.gnewrow .btn{height:34px;font-size:12px;flex:0 0 auto}
.chkrow{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px;color:#c9ced3;user-select:none}
.chkrow input{width:16px;height:16px;accent-color:var(--gold);cursor:pointer}
.watched-cta{border-color:var(--gold);color:var(--gold2)}
.watched-cta:hover{background:rgba(227,177,113,.12)}
/* toast */
.toast{position:fixed;left:50%;bottom:36px;transform:translate(-50%,14px);z-index:90;
  background:rgba(20,22,26,.96);border:1px solid rgba(255,255,255,.14);color:#eef0f2;
  padding:11px 18px;border-radius:10px;font-size:12.5px;opacity:0;pointer-events:none;transition:.25s;max-width:80vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{border-color:rgba(226,109,92,.5);color:#f2b0a6}

@media (max-width:920px){
  .wrap{flex-direction:column;gap:0}

<script>
"use strict";
/* ========= 基础工具 ========= */
const $id = (x)=>document.getElementById(x);
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
let _uid = 0;
function uid(p){ return p + Date.now().toString(36) + (_uid++).toString(36); }
function fmtGb(n){ n = Number(n)||0; return n % 1 === 0 ? String(n) : n.toFixed(1); }
function normName(s){
  return String(s||"").toLowerCase().replace(/\.[a-z0-9]+$/,"")
    .replace(/[【】\[\]()（）{}<>《》·._\-\s:：]/g,"").replace(/（|）/g,"");
}
function toast(msg, err){
  const t = $id("toast");
  t.textContent = msg; t.className = "toast on" + (err ? " err" : "");
  clearTimeout(t._tm); t._tm = setTimeout(()=>{ t.className = "toast"; }, 3200);
}
const PLACEHOLDER = '<div class="noposter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 8h18M7 4v4M11 4v4M15 4v4M19 4v4M7 16v4M17 16v4M3 16h18"></path></svg><div class="ph-t">待添加封面</div></div>';

/* ========= 数据层 ========= */
const LS_KEY = "wb_filmcase_v1";
let db = { movies:[], actors:[], series:[], directors:[], countries:[] };
function loadDB(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw !== null){ db = JSON.parse(raw); }
    else{
      const baked = JSON.parse($id("lib-data").textContent || "{}");
      if(baked.movies && baked.movies.length){ db = baked; }
      else{ db = JSON.parse($id("seed-data").textContent); }
      saveDB();
    }
  }catch(e){ db = { movies:[], actors:[], series:[], directors:[], countries:[] }; }
  db.movies = db.movies || []; db.actors = db.actors || [];
  db.series = db.series || []; db.directors = db.directors || []; db.countries = db.countries || [];
  // 国家主数据统一出口：去空白、去重
  db.countries = [...new Set(db.countries.map(c=>String(c||"").trim()).filter(Boolean))];
  // 字段规范统一出口：新旧数据统一补齐默认值，避免散落判断
  db.movies.forEach(m=>{
    m.actors = m.actors || [];
    if(!m.video || !m.video.name) m.video = null;
    // 状态统一出口：status ∈ 想看/在看/已看/""，旧数据 watched 布尔自动映射
    if(["想看","在看","已看"].indexOf(m.status) < 0) m.status = m.watched ? "已看" : "";
    m.watched = m.status === "已看";
    // 观看日期：仅接受 YYYY-MM-DD，非法值统一清空
    if(!/^\d{4}-\d{2}-\d{2}$/.test(String(m.watchDate||""))) m.watchDate = "";
    m.country = String(m.country||"").trim();
  });
  db.series.forEach(s=>{
    s.actors = s.actors || [];
    if(["想看","在看","已看"].indexOf(s.status) < 0) s.status = "";
    s.totalEp = Number(s.totalEp) || 0;
    s.watchedEp = Number(s.watchedEp) || 0;
    // 追剧起止时间：仅接受 YYYY-MM-DD
    if(!/^\d{4}-\d{2}-\d{2}$/.test(String(s.startDate||""))) s.startDate = "";
    if(!/^\d{4}-\d{2}-\d{2}$/.test(String(s.endDate||""))) s.endDate = "";
    s.country = String(s.country||"").trim();
  });
  db.actors.forEach(a=>{
    a.avatar = a.avatar || "";
    a.photos = Array.isArray(a.photos) ? a.photos.filter(p=>p && p.id && p.src) : [];
    a.added = a.added || Date.now();
  });
}

/* ========= 计算层 ========= */
const STATUS_LIST = ["想看","在看","已看"];
const PRESET_COUNTRIES = ["中国","日本","韩国","法国","美国","意大利"];
const STATUS_CLS = {"想看":"st-want","在看":"st-ing","已看":""};
function statusBadge(s, extra){
  if(STATUS_LIST.indexOf(s) < 0) return "";
  return '<span class="seen '+STATUS_CLS[s]+'"'+(extra||"")+'>'+s+'</span>';
}
function genresOf(items){
  const set = new Set();
  items.forEach(x=>String(x.genre||"").split(/[\/、,，]/).forEach(g=>{ g=g.trim(); if(g) set.add(g); }));
  return ["全部", ...[...set].sort((a,b)=>a.localeCompare(b,"zh"))];
}
function statusCount(list, s){ return list.filter(x=>x.status===s).length; }
function genreCount(list, g){
  return list.filter(x=>String(x.genre||"").split(/[\/、,，]/).some(t=>t.trim()===g)).length;
}
function matchFilters(x){
  if(view.status!=="全部" && x.status!==view.status) return false;
  if(view.genre!=="全部" && !String(x.genre||"").split(/[\/、,，]/).some(g=>g.trim()===view.genre)) return false;
  if(view.country!=="全部"){
    const c = String(x.country||"").trim();
    if(view.country === "未填写"){ if(c) return false; }
    else if(c !== view.country) return false;
  }
  return true;
}
function countriesOf(items){
  const set = new Set();
  let hasEmpty = false;
  items.forEach(x=>{
    const c = String(x.country||"").trim();
    if(c) set.add(c); else hasEmpty = true;
  });
  const out = ["全部", ...[...set].sort((a,b)=>a.localeCompare(b,"zh"))];
  if(hasEmpty) out.push("未填写");
  return out;
}
function countryCount(list, c){
  if(c === "未填写") return list.filter(x=>!String(x.country||"").trim()).length;
  return list.filter(x=>String(x.country||"").trim()===c).length;
}
function currentMovies(){
  const q = view.q.trim().toLowerCase();
  let list = db.movies.filter(m=>{
    if(!matchFilters(m)) return false;
    if(q){
      const hay = (m.title+" "+(m.country||"")+" "+(m.genre||"")+" "+(m.synopsis||"")+" "+(m.director||"")+" "
        + (m.actors||[]).map(id=>{const a=actorById(id);return a?a.name:"";}).join(" ")).toLowerCase();
      if(hay.indexOf(q) < 0) return false;
    }
    return true;
  });
  const s = view.sort;
  list.sort((a,b)=>{
    if(s==="name") return String(a.title).localeCompare(String(b.title),"zh");
    if(s==="gb") return (Number(b.sizeGb)||0)-(Number(a.sizeGb)||0);
    if(s==="year") return (parseInt(b.year)||0)-(parseInt(a.year)||0);
    if(s==="rating") return (Number(b.rating)||0)-(Number(a.rating)||0);
    return (Number(b.added)||0)-(Number(a.added)||0);
  });
  return list;
}
function currentSeries(){
  const q = view.q.trim().toLowerCase();
  let list = db.series.filter(s=>{
    if(!matchFilters(s)) return false;
    if(q){
      const hay = (s.title+" "+(s.country||"")+" "+(s.genre||"")+" "+(s.synopsis||"")+" "+(s.review||"")+" "
        + (s.actors||[]).map(id=>{const a=actorById(id);return a?a.name:"";}).join(" ")).toLowerCase();
      if(hay.indexOf(q) < 0) return false;
    }
    return true;
  });
  const s = view.sort;
  list.sort((a,b)=>{
    if(s==="name") return String(a.title).localeCompare(String(b.title),"zh");
    if(s==="gb") return (Number(b.watchedEp)||0)/(Number(b.totalEp)||1)-(Number(a.watchedEp)||0)/(Number(a.totalEp)||1);
    if(s==="year") return (parseInt(b.year)||0)-(parseInt(a.year)||0);
    if(s==="rating") return (Number(b.rating)||0)-(Number(a.rating)||0);
    return (Number(b.added)||0)-(Number(a.added)||0);
  });
  return list;
}
function currentActors(){
  const q = view.q.trim().toLowerCase();
  let list = db.actors.filter(a=>{
    if(!q) return true;
    const hay = (a.name+" "+(a.bio||"")+" "+(a.country||"")).toLowerCase();
    return hay.indexOf(q) >= 0;
  });
  list.sort((a,b)=>String(a.name).localeCompare(String(b.name),"zh"));
  return list;
}

/* ========= 侧栏观看热力图（近 18 周，日历周格） ========= */
function watchEvents(){
  // 汇总三类观看事件：影片看完、剧集开始追、剧集看完
  const acts = {};
  const add = (dateStr, kind)=>{
    if(!/^\d{4}-\d{2}-\d{2}$/.test(String(dateStr||""))) return;
    const o = acts[dateStr] = acts[dateStr] || { mv:0, st:0, ed:0 };
    o[kind]++;
  };
  db.movies.forEach(m=>{ if(m.watchDate) add(m.watchDate, "mv"); });
  db.series.forEach(s=>{
    if(s.startDate) add(s.startDate, "st");
    if(s.endDate) add(s.endDate, "ed");
  });
  return acts;
}
function renderHeatmap(){
  const grid = $id("hgrid"), sum = $id("hsum");
  if(!grid) return;
  const WEEKS = 18, PITCH = 11;
  const acts = watchEvents();
  const today = new Date(); today.setHours(0,0,0,0);
  // 周以周日开始；最后一列为今天所在周，向前推 WEEKS-1 列
  const lastColStart = new Date(today); lastColStart.setDate(lastColStart.getDate() - today.getDay());
  const firstColStart = new Date(lastColStart); firstColStart.setDate(firstColStart.getDate() - (WEEKS-1)*7);
  const levelOf = t => t<=0 ? 0 : (t===1 ? 1 : (t===2 ? 2 : (t===3 ? 3 : 4)));
  const MONTHS = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
  // 月份标签：某列首日所在月份与前列不同时标注
  let monthHtml = "", lastMonth = -1, lastLabelWeek = -3, totalEvents = 0, activeDays = 0;
  for(let w=0; w<WEEKS; w++){
    const d = new Date(firstColStart); d.setDate(d.getDate() + w*7);
    if(d.getMonth() !== lastMonth && w - lastLabelWeek >= 2){
      lastMonth = d.getMonth();
      lastLabelWeek = w;
      const left = w*PITCH + 2;
      monthHtml += '<span style="left:'+left+'px">'+MONTHS[lastMonth]+'</span>';
    }
  }
  let colsHtml = "";
  const dayNames = ["日","一","二","三","四","五","六"];
  for(let w=0; w<WEEKS; w++){
    let cells = "";
    for(let dow=0; dow<7; dow++){
      const d = new Date(firstColStart); d.setDate(d.getDate() + w*7 + dow);
      const iso = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
      if(d > today){ cells += '<span class="hcell future"></span>'; continue; }
      const a = acts[iso];
      const t = a ? a.mv + a.st + a.ed : 0;
      totalEvents += t;
      if(t > 0) activeDays++;
      const tip = a
        ? iso.replace(/-/g,"/")+"："
          + [a.mv?"观看影片 "+a.mv+" 部":"", a.st?"开始追剧 "+a.st+" 部":"", a.ed?"看完剧集 "+a.ed+" 部":""].filter(Boolean).join("，")
        : iso.replace(/-/g,"/")+"：无记录";
      cells += '<span class="hcell'+(t?" l"+levelOf(t):"")+(d.getTime()===today.getTime()?" today":"")
        +'" title="'+esc(tip)+'"></span>';
    }
    colsHtml += '<div class="hcol">'+cells+'</div>';
  }
  grid.innerHTML =
    '<div class="hmonths">'+monthHtml+'</div>'
    + '<div class="hdays">'+[0,2,4,6].map(r=>'<span>'+dayNames[r]+'</span>').join("")+'</div>'
    + '<div class="hcols">'+colsHtml+'</div>';
  sum.innerHTML = '近 '+WEEKS+' 周共 <b>'+totalEvents+'</b> 次观看记录，分布在 <b>'+activeDays+'</b> 天';
}

/* ========= 演员资料派生信息（集中出口） ========= */
const ZODIAC = [["摩羯",120],["水瓶",219],["双鱼",321],["白羊",420],["金牛",521],["双子",622],
  ["巨蟹",723],["狮子",823],["处女",923],["天秤",1024],["天蝎",1123],["射手",1222],["摩羯",1232]];
const CYCLE = ["鼠","牛","虎","兔","龙","蛇","马","羊","猴","鸡","狗","猪"];
function zodiacOf(birth){
  const d = String(birth||"").split("-");
  if(d.length < 2 || !/^\d{4}$/.test(d[0]) || !(+d[1] >= 1 && +d[1] <= 12)) return "";
  const mth = +d[1], day = +d[2]||1, v = mth*100+day;
  for(const [z,edge] of ZODIAC){ if(v < edge) return z+"座"; }
  return "摩羯座";
}
function cycleOf(birth){
  const y = parseInt(String(birth||"").split("-")[0]);
  return y ? CYCLE[(y-4)%12] : "";
}
function ageOf(birth){
  const d = String(birth||"");
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) return "";
  const b = new Date(d), now = new Date();
  if(isNaN(b.getTime())) return "";
  let age = now.getFullYear()-b.getFullYear();
  if(now < new Date(now.getFullYear(), b.getMonth(), b.getDate())) age--;
  return age >= 0 && age < 200 ? age+"岁" : "";
}
function fmtBytes(n){
  if(!n) return "0 GB";
  const gb = n/1073741824;
  if(gb >= 1) return (Math.round(gb*100)/100)+" GB";
  const mb = n/1048576;
  return mb >= 1 ? (Math.round(mb*10)/10)+" MB" : Math.max(1,Math.round(n/1024))+" KB";
}

function movePhoto(a, i, dir){
  const j = i + dir;

  saveDB(); openActorDetail(a.id);
}

const BASE_GENRES = ["剧情","动作","爱情","科幻","喜剧"];
function knownGenres(){
  const set = new Set(BASE_GENRES);
  db.movies.forEach(m=>String(m.genre||"").split(/[\/、,，]/).forEach(g=>{ g=g.trim(); if(g) set.add(g); }));
  db.series.forEach(s=>String(s.genre||"").split(/[\/、,，]/).forEach(g=>{ g=g.trim(); if(g) set.add(g); }));
  return [...set];
}
const gState = {}; // 前缀 -> { sel:[], extra:[] }
/* 国家下拉：预置 + 主数据 + 影片/剧集已用国家，统一去重排序 */
function knownCountries(){
  const set = new Set(PRESET_COUNTRIES);
  db.countries.forEach(c=>{ c = String(c||"").trim(); if(c) set.add(c); });
  db.movies.forEach(m=>{ const c = String(m.country||"").trim(); if(c) set.add(c); });
  db.series.forEach(s=>{ const c = String(s.country||"").trim(); if(c) set.add(c); });
  return [...set].sort((a,b)=>a.localeCompare(b,"zh"));
}
function initCountrySel(p, initial){
  const sel = $id(p+"Country"); if(!sel) return;
  initial = String(initial||"").trim();
  const row = $id(p+"CNewRow"), inp = $id(p+"CNewName");
  const rebuild = (selected)=>{
    const cs = knownCountries();
    if(selected && cs.indexOf(selected) < 0) cs.push(selected); // 编辑旧数据兜底：选中值即使不在列表也补一项
    sel.innerHTML = '<option value=""'+(selected===""?" selected":"")+'>未填写</option>'
      + cs.map(c=>'<option value="'+esc(c)+'"'+(c===selected?" selected":"")+'>'+esc(c)+'</option>').join("")
      + '<option value="__new__">＋ 新增国家…</option>';
  };
  rebuild(initial);
  sel.onchange = function(){
    if(this.value === "__new__"){ row.hidden = false; inp.focus(); }
    else row.hidden = true;
  };
  const confirmNew = ()=>{
    const v = inp.value.trim();
    if(!v){ toast("请输入国家名称", true); return; }
    if(db.countries.indexOf(v) < 0){ db.countries.push(v); toast("已保存新国家「"+v+"」"); }
    inp.value = ""; row.hidden = true;
    rebuild(v); // 与已有国家重名时自动选中已有项
  };
  $id(p+"CNewOk").onclick = confirmNew;
  inp.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); confirmNew(); } });
}
function readCountrySel(p, fallback){
  const sel = $id(p+"Country");
  if(!sel) return String(fallback||"").trim();
  const v = sel.value;
  // 停留在"新增"输入行未确认时，回退到原值，避免静默清空
  return v === "__new__" ? String(fallback||"").trim() : v;
}
function daysInMonth(y,mth){ return new Date(y, mth, 0).getDate(); }
function parseDateParts(obj){
  let y="",mth="",d="";
  const rd = String((obj && obj.releaseDate)||"");
  if(/^\d{4}-\d{2}-\d{2}/.test(rd)){ y=rd.slice(0,4); mth=String(+rd.slice(5,7)); d=String(+rd.slice(8,10)); }
  else if(/^\d{4}-\d{2}/.test(rd)){ y=rd.slice(0,4); mth=String(+rd.slice(5,7)); }
  else if(/^\d{4}/.test(rd)){ y=rd.slice(0,4); }
  else if(/^\d{4}$/.test(String((obj && obj.year)||""))){ y=obj.year; }
  return {y:y, mth:mth, d:d};
}
function initDateSel(p, obj){
  const row = $id(p+"DateRow"); if(!row) return;
  const cur = new Date().getFullYear();
  const pt = parseDateParts(obj);
  row.innerHTML =
    '<select id="'+p+'Dy"><option value="">— 年 —</option>'
    + Array.from({length:cur+1-1900},(_,i)=>String(cur-i)).map(v=>'<option value="'+v+'"'+(v===pt.y?" selected":"")+'>'+v+'</option>').join("")
    + '</select>'
    + '<select id="'+p+'Dm"><option value="">— 月 —</option>'
    + Array.from({length:12},(_,i)=>String(i+1)).map(v=>'<option value="'+v+'"'+(v===pt.mth?" selected":"")+'>'+v+' 月</option>').join("")
    + '</select>'
    + '<select id="'+p+'Dd"></select>';
  renderDayOpts(p, pt.d);
  $id(p+"Dy").onchange = ()=>renderDayOpts(p);
  $id(p+"Dm").onchange = ()=>renderDayOpts(p);
}
function renderDayOpts(p, sel){
  const dd = $id(p+"Dd"); if(!dd) return;
  const mthVal = $id(p+"Dm").value;
  // 初始化时回显已保存的"日"；变更年月时保留当前选择（新月不含该日则自然清空）
  const prev = (sel !== undefined) ? sel : dd.value;
  const n = mthVal ? daysInMonth(+$id(p+"Dy").value||2000, +mthVal) : 31;
  // 未选月份前禁用"日"，避免出现"选了日却存不进去"的静默丢值
  dd.disabled = !mthVal;
  dd.innerHTML = '<option value="">— 日 —</option>'
    + Array.from({length:n},(_,i)=>String(i+1)).map(v=>'<option value="'+v+'"'+(v===prev?" selected":"")+'>'+v+' 日</option>').join("");
}

function readStatusChips(p){

function genreStrOf(p){ return gState[p].sel.join("/"); }
function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function validDateOrEmpty(v){
  return /^\d{4}-\d{2}-\d{2}$/.test(String(v||"")) ? v : "";
}
// 日期回显格式化：1994 → 1994年；2010-09 → 2010年9月；2010-09-01 → 2010年9月1日
function fmtDateDisp(v){
  const s = String(v||"");
  let t;
  if((t = s.match(/^(\d{4})-(\d{2})-(\d{2})$/))) return (+t[1])+"年"+(+t[2])+"月"+(+t[3])+"日";
  if((t = s.match(/^(\d{4})-(\d{2})$/))) return (+t[1])+"年"+(+t[2])+"月";
  if(/^\d{4}$/.test(s)) return s+"年";
  return s;
}
function submitMovie(){

/* ========= 视频文件关联与页内播放 ========= */
const VIDEO_EXT = ["mp4","mkv","avi","rmvb","rm","mov","wmv","flv","m4v","ts","mpg","mpeg","webm","m2ts"];
function videoMetaFromFile(f){
  const mm = String(f.name||"").toLowerCase().match(/\.([a-z0-9]+)$/);
  const ext = mm ? mm[1] : "";
  if(VIDEO_EXT.indexOf(ext) < 0 && !/^video\//.test(f.type)) return null;
  return { name:f.name, size:f.size, ext:ext||"bin", lastModified:f.lastModified };
}
const FILM_ICO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:16px;height:16px;flex:0 0 auto;opacity:.6"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 8h18M7 4v4M11 4v4M15 4v4M19 4v4M7 16v4M17 16v4M3 16h18"></path></svg>';
function renderVfile(){
  const box = $id("vfileBox"); if(!box) return;
  if(!pendingVideoMeta){ box.innerHTML = '<span style="color:var(--dim2);font-size:12.5px">未选择视频文件（仅保存文件名、容量等元数据，不复制文件本身）</span>'; return; }
  box.innerHTML = '<div class="vfile">'+FILM_ICO+'<b>'+esc(pendingVideoMeta.name)+'</b>'
    + '<span>'+fmtBytes(pendingVideoMeta.size)+' · '+esc(String(pendingVideoMeta.ext).toUpperCase())+'</span>'
    + '<button class="btn ghost" id="fClearVideo" type="button">清除关联</button></div>';
  $id("fClearVideo").onclick = ()=>{ pendingVideoMeta = null; pendingVideoFile = null; renderVfile(); };
}
function playMovieVideo(m){
  if(!m.video){ toast("该影片尚未关联视频文件，请先在编辑表单中从磁盘选择", true); return; }
  const f = videoFiles.get(m.id);
  if(f){ startBlobPlay(m, f); return; }
  $id("videoPlayPick").setAttribute("data-target", m.id);
  $id("videoPlayPick").click();
}
function startBlobPlay(m, f){
  stopBlobPlay();
  const vis = $id("dVisual"); if(!vis) return;
  lastBlobUrl = URL.createObjectURL(f);
  vis.innerHTML = '<video controls autoplay src="'+lastBlobUrl+'" style="width:100%;height:100%;max-height:420px;background:#000;display:block"></video>';
  const v = vis.querySelector("video");
  if(v) v.onerror = function(){
    stopBlobPlay();
    toast("浏览器不支持页内播放该格式（如 MKV / AVI），请在本地用播放器打开", true);
    openMovieDetail(m.id);
  };
}
function stopBlobPlay(){
  if(lastBlobUrl){ try{ URL.revokeObjectURL(lastBlobUrl); }catch(e){} lastBlobUrl = ""; }
}

function submitActor(){
  const name = $id("aName").value.trim();
  if(!name){ toast("姓名为必填项", true); return; }
  const birth = $id("aBirth").value;
  if(birth && !/^\d{4}-\d{2}-\d{2}$/.test(birth)){ toast("生日格式不正确", true); return; }
  const editId = $id("aSave").getAttribute("data-edit");
  const a = actorById(editId) || { id:uid("a"), photos:[], added:Date.now() };
  a.name = name;
  a.enName = $id("aEn").value.trim();
  a.alias = $id("aAlias").value.trim();
  a.gender = $id("aGender").value;
  a.birth = birth;
  a.blood = $id("aBlood").value;
  a.country = $id("aCountry").value.trim();
  // 国家记忆：新国家自动入主数据，后续可重复选择
  if(a.country && db.countries.indexOf(a.country) < 0){ db.countries.push(a.country); toast("已保存新国籍「"+a.country+"」"); }
  a.birthplace = $id("aBirthplace").value.trim();
  a.job = $id("aJob").value.trim();
  a.agency = $id("aAgency").value.trim();
  a.debut = $id("aDebut").value.trim();
  a.bio = $id("aBio").value.trim();
  a.avatar = pendingAvatar;
  if(!db.actors.includes(a)) db.actors.push(a);
  saveDB(); closeSheet(); refreshAll();
  toast("演员「"+name+"」已保存");
}

/* ========= 照片管理（相册上传 / 预览 / 排序 / 删除 / 设封面） ========= */
function uploadPhotos(a, files){
  const list = Array.prototype.filter.call(files, f=>/image\/(jpeg|png|webp)/.test(f.type) || /\.(jpe?g|png|webp)$/i.test(f.name));
  if(!list.length){ toast("未选中有效的图片文件（支持 jpg / png / webp）", true); return; }
  const oversize = list.filter(f=>f.size > 15*1048576);
  if(oversize.length){ toast("有 "+oversize.length+" 张照片超过 15MB，请压缩后再上传", true); return; }
  let done = 0, failed = 0;
  list.forEach(f=>{
    compressImage(f, 800, 0.72, (dataUrl)=>{
      done++;
      if(dataUrl) a.photos.push({ id:uid("p"), src:dataUrl });
      else failed++;
      if(done === list.length){
        if(!a.avatar && a.photos.length) a.avatar = a.photos[0].src;
        saveDB(); openPhotoManager(a);
        toast("已上传 "+(list.length-failed)+" 张照片" + (failed?("，"+failed+" 张读取失败"):""));
      }
    });
  });
}
function openPhotoManager(a){
  openSheet(
    '<div class="form slim"><h2 style="font-size:18px">照片管理 · '+esc(a.name)+'</h2>'
    + '<div class="hintbox">支持 jpg / png / webp，单张不超过 <b>15MB</b>（自动压缩存档）；<b>悬停照片</b>可设为封面、左右移动排序、删除；<b>点击照片</b>可放大预览。</div>'
    + '<div class="acts" style="margin-bottom:14px">'
    + '<button class="btn primary" id="btnUpPhotos" type="button">上传照片（可多选）</button>'
    + '<button class="btn ghost" id="btnPmClose" type="button">完成</button></div>'
    + '<div class="photo-grid">'+(a.photos.length
        ? a.photos.map((p,i)=>'<div class="photo-item">'
            + (p.src===a.avatar?'<span class="covmark">封面</span>':'')
            + '<img src="'+p.src+'" alt="" data-lb="'+i+'" loading="lazy">'
            + '<div class="pacts">'
            +   '<button class="pbtn" type="button" data-setcov="'+i+'">'+(p.src===a.avatar?'换封面':'设封面')+'</button>'
            +   '<button class="pbtn" type="button" data-mvup="'+i+'">←</button>'
            +   '<button class="pbtn" type="button" data-mvdn="'+i+'">→</button>'
            +   '<button class="pbtn del" type="button" data-delp="'+i+'">删</button>'
            + '</div></div>').join("")
        : '<span style="color:var(--dim2);font-size:12.5px">暂无照片，点上方按钮上传</span>')+'</div>'
    + '</div>', true
  );
  $id("btnUpPhotos").onclick = ()=>$id("photoPick").click();
  $id("btnPmClose").onclick = ()=>openActorDetail(a.id);
  $id("photoPick").setAttribute("data-target", a.id);
  const sheet = $id("sheet");
  Array.prototype.forEach.call(sheet.querySelectorAll("[data-lb]"), b=>{
    b.onclick = ()=>openLightbox(a, +b.getAttribute("data-lb"));
  });
  Array.prototype.forEach.call(sheet.querySelectorAll("[data-setcov]"), b=>{
    b.onclick = ()=>{ a.avatar = a.photos[+b.getAttribute("data-setcov")].src;
      saveDB(); openPhotoManager(a); toast("已设置封面照片"); };
  });
  Array.prototype.forEach.call(sheet.querySelectorAll("[data-mvup]"), b=>{
    b.onclick = ()=>movePhoto(a, +b.getAttribute("data-mvup"), -1);
  });
  Array.prototype.forEach.call(sheet.querySelectorAll("[data-mvdn]"), b=>{
    b.onclick = ()=>movePhoto(a, +b.getAttribute("data-mvdn"), 1);
  });
  Array.prototype.forEach.call(sheet.querySelectorAll("[data-delp]"), b=>{
    b.onclick = ()=>{
      const i = +b.getAttribute("data-delp");
      if(!confirm("确定删除这张照片吗？")) return;
      const rm = a.photos.splice(i,1)[0];
      if(rm && rm.src===a.avatar) a.avatar = a.photos.length ? a.photos[0].src : "";
      saveDB(); openPhotoManager(a); toast("照片已删除");
    };
  });
}

/* ========= 大图预览 ========= */
let lbActor = null, lbIdx = 0;
function openLightbox(a, i){
  lbActor = a; lbIdx = i;
  renderLightbox();
  $id("lightbox").classList.add("on");
}
function renderLightbox(){
  const a = lbActor; if(!a) return;
  const p = a.photos[lbIdx];
  $id("lightbox").innerHTML =
    '<img src="'+(p?p.src:"")+'" alt="">'
    + '<div class="lb-acts">'
    + '<button class="btn ghost" id="lbPrev" type="button">‹ 上一张</button>'
    + '<span class="lb-idx">'+(lbIdx+1)+' / '+a.photos.length+' · '+esc(a.name)+'</span>'
    + '<button class="btn ghost" id="lbNext" type="button">下一张 ›</button>'
    + '<button class="btn" id="lbClose" type="button">关闭</button>'
    + '</div>';
  $id("lbPrev").onclick = ()=>{ lbIdx = (lbIdx-1+a.photos.length)%a.photos.length; renderLightbox(); };
  $id("lbNext").onclick = ()=>{ lbIdx = (lbIdx+1)%a.photos.length; renderLightbox(); };
  $id("lbClose").onclick = closeLightbox;
}
function closeLightbox(){ $id("lightbox").classList.remove("on"); $id("lightbox").innerHTML = ""; lbActor = null; }
$id("lightbox").onclick = function(e){ if(e.target === $id("lightbox")) closeLightbox(); };
document.addEventListener("keydown", e=>{
  if(!$id("lightbox").classList.contains("on")) return;
  if(e.key==="Escape") closeLightbox();
  if(e.key==="ArrowLeft" && lbActor){ lbIdx=(lbIdx-1+lbActor.photos.length)%lbActor.photos.length; renderLightbox(); }
  if(e.key==="ArrowRight" && lbActor){ lbIdx=(lbIdx+1)%lbActor.photos.length; renderLightbox(); }
});

/* ========= 封面：压缩 + 按片名匹配 ========= */
function compressImage(file, maxW, q, cb){
  const reader = new FileReader();
  reader.onload = function(){
    const img = new Image();
    img.onload = function(){
      const scale = Math.min(1, maxW / img.width);
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL("image/jpeg", q));
    };
    img.onerror = ()=>cb("");
    img.src = reader.result;
  };
  reader.onerror = ()=>cb("");
  reader.readAsDataURL(file);
}
function matchCovers(files){
  const jobs = [];
  Array.prototype.forEach.call(files, f=>{
    if(!/image\//.test(f.type) && !/\.(jpe?g|png|webp)$/i.test(f.name)) return;
    jobs.push({ file:f, name:normName(f.name) });
  });
  if(!jobs.length){ toast("未选中有效的图片文件", true); return; }
  let done = 0, hit = 0;
  jobs.forEach(j=>{
    compressImage(j.file, 480, 0.72, (dataUrl)=>{
      done++;
      if(dataUrl){
        const target = db.movies.find(m=>normName(m.title)===j.name)
          || db.movies.find(m=>j.name.indexOf(normName(m.title))>=0 && normName(m.title).length>=2);
        if(target){ target.cover = dataUrl; hit++; }
      }
      if(done === jobs.length){
        saveDB(); refreshAll();
        toast("封面匹配完成：成功 "+hit+" 部，未匹配 "+(jobs.length-hit)+" 张" + (hit?"（可手动逐部指定）":""));
      }
    });
  });
}

/* ========= 数据菜单：导出 / 导入 / 清空 ========= */
function bakeData(){
  const node = $id("lib-data");
  if(node) node.textContent = JSON.stringify(db).replace(/</g,"\\u003c");
}
function download(name, blob){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function exportHTML(){
  closeSheet(); bakeData();
  const keep = { grid:$id("grid").innerHTML, chips:$id("chips").innerHTML, ag:$id("actorGrid").innerHTML };
  $id("grid").innerHTML = ""; $id("chips").innerHTML = ""; $id("actorGrid").innerHTML = "";
  const html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  $id("grid").innerHTML = keep.grid; $id("chips").innerHTML = keep.chips; $id("actorGrid").innerHTML = keep.ag;
  download("影匣备份-"+new Date().toISOString().slice(0,10)+".html", new Blob([html],{type:"text/html;charset=utf-8"}));
  toast("已导出备份 HTML（双击即可在其他电脑恢复全部数据）");
}
function exportJSON(){
  download("影匣数据-"+new Date().toISOString().slice(0,10)+".json",
    new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));
  toast("已导出 JSON 数据文件");
}
function importJSON(file){
  const r = new FileReader();
  r.onload = function(){
    try{
      const d = JSON.parse(r.result);
      if(!d || !Array.isArray(d.movies) || !Array.isArray(d.actors)) throw new Error("格式不符");
      if(!confirm("导入将覆盖当前全部数据（影片 "+d.movies.length+" 部、演员 "+d.actors.length+" 位），确定继续吗？")) return;
      db = d; saveDB(); view.status = "全部"; view.genre = "全部"; view.country = "全部"; view.q = ""; $id("q").value = "";
      refreshAll(); toast("数据导入成功");
    }catch(e){ toast("导入失败：文件格式不正确", true); }
  };
  r.readAsText(file);
}
function openDataMenu(){
  openSheet(
    '<div class="form slim"><h2 style="font-size:18px">数据管理</h2>'
    + '<div class="hintbox">数据保存在<b>本机浏览器</b>中（当前占用约 <b>'+(JSON.stringify(db).length/1048576).toFixed(2)+' MB</b>；照片越多占用越大，超出上限时将无法保存，请及时导出备份）。换电脑、重装系统或清理浏览器数据前，请先导出备份；导出的 <b>HTML 备份</b> 双击即可直接恢复使用。</div>'
    + '<div class="menu">'
    + '<button class="btn primary" id="mHtml" type="button">导出备份（HTML，含全部数据）</button>'
    + '<button class="btn" id="mJson" type="button">导出数据（JSON 文件）</button>'
    + '<button class="btn" id="mImport" type="button">从 JSON 文件导入（覆盖当前数据）</button>'
    + '<button class="btn danger" id="mClear" type="button">清空全部数据</button>'
    + '</div></div>', true
  );
  $id("mHtml").onclick = exportHTML;
  $id("mJson").onclick = exportJSON;
  $id("mImport").onclick = ()=>$id("importPick").click();
  $id("mClear").onclick = ()=>{
    if(!confirm("确定清空全部影片与演员数据吗？此操作不可恢复，建议先导出备份。")) return;
    if(!confirm("再次确认：真的要清空吗？")) return;
    db = { movies:[], actors:[], series:[], directors:[], countries:[] }; saveDB(); closeSheet(); refreshAll(); toast("数据已清空");
  };
}

/* ========= 事件绑定与初始化 ========= */
function bind(){
  $id("btnAddMovie").onclick = ()=>openMovieForm(null);
  $id("btnAddSeries").onclick = ()=>openSeriesForm(null);
  $id("btnAddActor").onclick = ()=>openActorForm(null);
  $id("btnData").onclick = openDataMenu;
  $id("btnMatch").onclick = openMatchHint;
  $id("tabMovies").onclick = ()=>{ view.tab = "movies"; view.status = "全部"; view.genre = "全部"; view.country = "全部"; setTabs(); refreshAll(); };
  $id("tabSeries").onclick = ()=>{ view.tab = "series"; view.status = "全部"; view.genre = "全部"; view.country = "全部"; setTabs(); refreshAll(); };
  $id("tabActors").onclick = ()=>{ view.tab = "actors"; view.status = "全部"; view.genre = "全部"; view.country = "全部"; setTabs(); refreshAll(); };
  $id("q").addEventListener("input", function(){ view.q = this.value; refreshAll(); });
  $id("sort").onchange = function(){ view.sort = this.value; refreshAll(); };
  $id("posterMatch").addEventListener("change", function(){
    if(this.files && this.files.length) matchCovers(this.files);
    this.value = "";
  });
  $id("posterSingle").addEventListener("change", function(){
    const f = this.files && this.files[0];
    this.value = "";
    if(!f) return;
    compressImage(f, 480, 0.72, (dataUrl)=>{
      if(!dataUrl){ toast("图片读取失败", true); return; }
      pendingCover = dataUrl;
      $id("fThumb").innerHTML = '<img src="'+dataUrl+'" alt="">';
    });
  });
  $id("importPick").addEventListener("change", function(){
    const f = this.files && this.files[0];
    this.value = "";
    if(f) importJSON(f);
  });
  $id("avatarPick").addEventListener("change", function(){
    const target = this.getAttribute("data-target");
    const f = this.files && this.files[0];
    this.value = "";
    if(!f) return;
    if(f.size > 15*1048576){ toast("照片超过 15MB，请压缩后再上传", true); return; }
    compressImage(f, 480, 0.78, (dataUrl)=>{
      if(!dataUrl){ toast("图片读取失败", true); return; }
      if(target){
        const a = actorById(target);
        if(a){ a.avatar = dataUrl; saveDB(); openActorDetail(target); toast("封面照片已更新"); }
      }else{
        pendingAvatar = dataUrl;
        if($id("aThumb")) $id("aThumb").innerHTML = '<img src="'+dataUrl+'" style="width:100%;height:100%;object-fit:cover">';
      }
    });
  });
  $id("photoPick").addEventListener("change", function(){
    const target = this.getAttribute("data-target");
    // 注意：清空 input.value 会重置 FileList，必须先转为文件引用数组再清空
    const fs = Array.prototype.slice.call(this.files || []);
    this.value = "";
    this.removeAttribute("data-target");
    if(!target || !fs.length) return;
    const a = actorById(target);
    if(a) uploadPhotos(a, fs);
  });
  $id("videoPick").addEventListener("change", function(){
    const f = this.files && this.files[0];
    this.value = "";
    if(!f) return;
    const meta = videoMetaFromFile(f);
    if(!meta){ toast("不支持的文件格式，请选择常见视频文件（mp4 / mkv / avi 等）", true); return; }
    pendingVideoMeta = meta; pendingVideoFile = f;
    renderVfile();
  });
  $id("videoPlayPick").addEventListener("change", function(){
    const target = this.getAttribute("data-target");
    const f = this.files && this.files[0];
    this.value = "";
    if(!f || !target) return;
    const meta = videoMetaFromFile(f);
    if(!meta){ toast("不支持的文件格式，无法页内播放", true); return; }
    videoFiles.set(target, f);
    const m = movieById(target);
    if(m){ m.video = meta; saveDB(); startBlobPlay(m, f); }
  });
}
function setTabs(){
  $id("tabMovies").className = "tab" + (view.tab==="movies" ? " is-on" : "");
  $id("tabSeries").className = "tab" + (view.tab==="series" ? " is-on" : "");
  $id("tabActors").className = "tab" + (view.tab==="actors" ? " is-on" : "");
}
document.addEventListener("DOMContentLoaded", function(){
  loadDB();
  bind();
  refreshAll();
});
